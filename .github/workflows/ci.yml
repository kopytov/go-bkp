name: ci

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: install tools
        uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10

      - name: test
        run: scripts/test.sh

      # Without arguments lint.sh looks at the diff from HEAD, which is
      # empty here.
      - name: lint
        run: scripts/lint.sh .

  release:
    needs: check
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # The tags are needed for git describe to produce the version.
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: install tools
        uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10

      - name: build
        run: scripts/build.sh

      - name: verify
        run: |
          (cd dist && sha256sum -c SHA256SUMS)
          got=$(dist/bkp-linux-amd64 --version)
          if [[ $got != "$GITHUB_REF_NAME" ]]; then
              echo "bkp --version is $got, want $GITHUB_REF_NAME"
              exit 1
          fi

      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          pre=()
          [[ $GITHUB_REF_NAME == *-* ]] && pre=(--prerelease)
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes \
              --title "$GITHUB_REF_NAME" "${pre[@]}" \
              dist/bkp-linux-amd64 dist/bkp-linux-arm64 dist/SHA256SUMS
