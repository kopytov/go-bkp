version: "2"

linters:
  default: standard
  enable:
    - containedctx
    - depguard
    - errorlint
    - gochecknoinits
    - gocritic
    - gosec
    - misspell
    - nolintlint
    - revive
    - sloglint
    - tparallel
    - unconvert
    - unparam
    - usestdlibvars
    - usetesting
  settings:
    depguard:
      rules:
        main:
          list-mode: strict
          allow:
            - $gostd
            - go.yaml.in/yaml/v3
            - github.com/jlaffaye/ftp
            - github.com/kopytov/go-bkp
    errcheck:
      check-blank: true
    gosec:
      excludes:
        - G204
    nolintlint:
      require-explanation: true
      require-specific: true
  exclusions:
    presets:
      - comments

formatters:
  enable:
    - gofmt
    - goimports
